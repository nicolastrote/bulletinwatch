version: "3.8"

services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: bulletinwatch-scraper
    environment:
      - PORTAL_EMAIL=${PORTAL_EMAIL}
      - PORTAL_PASSWORD=${PORTAL_PASSWORD}
    volumes:
      - ./data:/app/data
      - /dev/shm:/dev/shm
    shm_size: 1GB
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          memory: 512M
